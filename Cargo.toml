[package]
name = "barbeque_client"
version = "0.1.0"
authors = ["Kohei Suzuki <eagletmt@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hyper = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

bytes = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "process"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"], optional = true }
http-body-util = { version = "0.1", optional = true }

[features]
default = []
mock_server = ["dep:bytes", "dep:tokio", "dep:uuid", "dep:hyper-util", "dep:http-body-util"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "enqueue"

[[example]]
name = "mock_server"
required-features = ["mock_server"]

[[example]]
name = "job"
